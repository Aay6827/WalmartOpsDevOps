# Only the API pods may reach PostgreSQL. Enforced on AKS with network_policy = "azure" (see terraform/main.tf).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-api-only
  namespace: walmartops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fulfilment-api
      ports:
        - protocol: TCP
          port: 5432