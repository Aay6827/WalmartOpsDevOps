apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfilment-api
  namespace: walmartops
  labels:
    app.kubernetes.io/name: fulfilment-api
    app.kubernetes.io/part-of: walmartops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfilment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfilment-api
        app.kubernetes.io/part-of: walmartops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api
          image: walmartopsdevops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/walmartops
            - name: APP_VERSION
              value: "1.0.0"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: fulfilment-api
  namespace: walmartops
  labels:
    app.kubernetes.io/name: fulfilment-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fulfilment-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Local-only convenience: exposes the API on node port 30000. Remove for cloud clusters and use an Ingress or LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: fulfilment-api-nodeport
  namespace: walmartops
  labels:
    app.kubernetes.io/name: fulfilment-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fulfilment-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fulfilment-api
  namespace: walmartops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fulfilment-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fulfilment-api
  namespace: walmartops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfilment-api